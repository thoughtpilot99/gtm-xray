ats:                # careers link pattern -> ATS
  greenhouse: ['boards\.greenhouse\.io/(?:embed/job_board\?for=)?([A-Za-z0-9_-]+)', 'job-boards\.(?:eu\.)?greenhouse\.io/([A-Za-z0-9_-]+)']
  lever: ['jobs\.(?:eu\.)?lever\.co/([A-Za-z0-9_.-]+)']
  ashby: ['jobs\.ashbyhq\.com/([A-Za-z0-9_.%-]+)']
  workable: ['apply\.workable\.com/([A-Za-z0-9_-]+)']
  smartrecruiters: ['(?:jobs|careers)\.smartrecruiters\.com/([A-Za-z0-9_-]+)']

# Tools a job description can name. Used to read a company's internal stack off its own job posts,
# and to find OTHER companies that use a competitor (the Displacement Engine).
